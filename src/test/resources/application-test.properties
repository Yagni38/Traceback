# Settings used only by "mvn test".
# Tests use a separate in-memory database, so they never touch your real data folder.
spring.datasource.url=jdbc:h2:mem:traceback_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Test-only admin login (not used when the real app runs)
traceback.admin.username=testadmin
traceback.admin.password=test-only-password
