spring.application.name=traceBack

# Port: hosting platforms (Vercel, Render, Railway...) pass it in the PORT
# environment variable. Locally it falls back to 8080.
server.port=${PORT:8080}

# ---------------------------------------------------------------
# Database: file-based H2 (data survives restarts)
# The database files are created in the "data" folder next to
# where you start the app, e.g. data\traceback_db.mv.db
# Override the location with the TRACEBACK_DB_URL environment variable.
# ---------------------------------------------------------------
spring.datasource.url=${TRACEBACK_DB_URL:jdbc:h2:file:./data/traceback_db}
# The JDBC driver is chosen automatically from the URL (H2 here, PostgreSQL in prod)
spring.datasource.username=${TRACEBACK_DB_USERNAME:sa}
spring.datasource.password=${TRACEBACK_DB_PASSWORD:}

# "update" keeps existing tables and data, and adds new columns when entities change
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 web console (admin login required, see SecurityConfig)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ---------------------------------------------------------------
# Admin login - NEVER put a real password in this file.
# Set it with environment variables before starting the app:
#   set TRACEBACK_ADMIN_USERNAME=admin
#   set TRACEBACK_ADMIN_PASSWORD=YourStrongPassword
# If no password is set, a random one is generated and printed
# in the console at startup.
# ---------------------------------------------------------------
traceback.admin.username=${TRACEBACK_ADMIN_USERNAME:admin}
traceback.admin.password=${TRACEBACK_ADMIN_PASSWORD:}

# Never send stack traces to the browser
server.error.include-stacktrace=never
server.error.include-message=always

# Admin password may be left empty locally (a temporary one is printed).
# The prod profile sets this to true so production never starts without one.
traceback.admin.require-password=false
