# ---------------------------------------------------------------
# PRODUCTION settings (Vercel / any cloud host)
# Activated with SPRING_PROFILES_ACTIVE=prod (set in Dockerfile.vercel).
# Everything secret comes from environment variables - nothing is stored here.
# ---------------------------------------------------------------

# PostgreSQL - never the local H2 file database.
# Option A: set DATABASE_URL (postgres://user:password@host:5432/db?sslmode=require),
#           as provided by Neon / Vercel Postgres / Supabase. TracebackApplication
#           converts it into the three values below automatically.
# Option B: set them yourself:
#   TRACEBACK_DB_URL=jdbc:postgresql://host:5432/dbname?sslmode=require
#   TRACEBACK_DB_USERNAME=...
#   TRACEBACK_DB_PASSWORD=...
# If neither is set, the app stops at startup with a clear error instead of
# silently using H2.
spring.datasource.url=${TRACEBACK_DB_URL}
spring.datasource.username=${TRACEBACK_DB_USERNAME}
spring.datasource.password=${TRACEBACK_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Serverless instances start and stop often: keep the connection pool small
spring.datasource.hikari.maximum-pool-size=${TRACEBACK_DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000

# Creates the tables on the first start and keeps existing data afterwards
spring.jpa.hibernate.ddl-auto=update

# The H2 console is a local development tool only
spring.h2.console.enabled=false

# The app runs behind Vercel's HTTPS proxy
server.forward-headers-strategy=framework

# Production must have a real admin password (TRACEBACK_ADMIN_PASSWORD)
traceback.admin.require-password=true

# Quieter logs in production
logging.level.org.hibernate.SQL=warn
